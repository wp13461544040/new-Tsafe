server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 账号导入可能一次贴几千行 JSON，默认 1M 会返回 413。
    # 后端 MAX_CONTENT_LENGTH 是 16M，这里保持一致。
    client_max_body_size 16m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # SPA 路由：/extract、/cards 这些都由前端接管，
    # 直接刷新时 nginx 找不到文件，必须回落到 index.html（否则 404）。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # `backend` 是 compose 里的服务名，靠容器网络的 DNS 解析
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跑批接口本身是立即返回的（任务在后台线程），但导入/导出几千条
        # 需要时间，超时给足
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    # 带 hash 的构建产物可以长期缓存；index.html 不能（否则发版后用户拿不到新版）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

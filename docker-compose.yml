version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: typesafe-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./exports:/app/exports
      - ./result:/app/result
    # 配置无需在此声明：
    #   · 站点参数 → 代码内置默认值，要改走「系统设置 → 站点配置」页
    #   · 邮箱凭据 → 「邮箱配置」页（存数据库）
    #   · JWT 密钥 → 首次启动自动生成到 backend/data/.secret_key（已挂载持久化）
    #
    # 🔴 这里曾有 `SECRET_KEY=your-secret-key-change-this-in-production`：
    #    ①变量名就是错的（代码读 `API_SECRET_KEY`，压根不生效）；
    #    ②即便名字对，那也是个公开字符串 —— JWT 用它签名，等于没有认证。
    #
    # 多实例部署时才需要显式指定密钥（让各实例共享），取消下面这行的注释：
    #   - API_SECRET_KEY=${API_SECRET_KEY}
    environment:
      - FLASK_ENV=production
    networks:
      - typesafe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: typesafe-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - typesafe-network

networks:
  typesafe-network:
    driver: bridge

volumes:
  backend-data:

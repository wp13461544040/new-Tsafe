# 服务器部署用：直接拉 ghcr.io 的镜像，不在服务器上构建
# （服务器通常没有 node/npm，也不该为了构建装一套工具链）。
#
# 推荐用 deploy.sh 一键部署，它会生成 .env 与 Caddyfile。
# 手动部署见文件末尾注释。

services:
  backend:
    image: ghcr.io/${GH_OWNER:?请先设置 GH_OWNER}/new-tsafe-backend:${IMAGE_TAG:-latest}
    container_name: jev-backend
    restart: unless-stopped

    volumes:
      # 🔴 这个必须挂：SQLite 库与自动生成的 JWT 密钥都在里面。
      #    不挂的话容器重建后管理员账号、卡密、账号池全丢，
      #    而且密钥变化会让所有人被踢下线。
      - backend-data:/app/backend/data
      # 注册器的交付物（accounts.json 等），挂出来方便宿主机直接查看
      - ./result:/app/result
      - ./exports:/app/exports

    # 不暴露到宿主机：只让 frontend 通过容器网络访问
    expose:
      - "5000"

    environment:
      # 多实例部署才需要显式指定（让各实例共享同一个签名密钥）。
      # 单实例留空即可 —— 容器会自动生成并存到挂载的 data 卷里。
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      # 首次启动创建管理员用。留空则随机生成，看 `docker compose logs backend` 取。
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 日志时间按北京时间输出（业务时间戳由 backend/timeutil.py 固定 UTC+8，不依赖此项）
      - TZ=Asia/Shanghai

    networks:
      - jev-net

  frontend:
    image: ghcr.io/${GH_OWNER:?请先设置 GH_OWNER}/new-tsafe-frontend:${IMAGE_TAG:-latest}
    container_name: jev-frontend
    restart: unless-stopped

    # 🔴 不直接映射宿主端口 —— 由 caddy 统一接管 80/443。
    #    映射了反而会和 caddy 抢端口，报 "address already in use"。
    expose:
      - "80"

    depends_on:
      backend:
        # 等后端健康检查通过再启动 —— 否则 nginx 首次代理会 502，
        # 刷新一下就好，但看起来像"部署失败"
        condition: service_healthy

    networks:
      - jev-net

  # ── 入口层：HTTPS 终结 + 反向代理 ────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: jev-caddy
    restart: unless-stopped

    ports:
      # 🔴 443 必须映射，80 也必须 —— Let's Encrypt 的 HTTP-01 校验
      #    要求 80 端口可从公网访问，只开 443 会导致证书申请失败。
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3（QUIC）走 UDP。不开也能用，开了首屏更快
      - "${HTTPS_PORT:-443}:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 🔴 证书必须持久化：Let's Encrypt 对同一域名有速率限制
      #    （每周 5 次重复申请）。不挂卷的话每次重建容器都重新申请，
      #    很快就会撞限额，然后几天内都签不出证书。
      - caddy-data:/data
      - caddy-config:/config

    depends_on:
      - frontend

    networks:
      - jev-net

volumes:
  # 命名卷由 Docker 管理，`docker compose down` 不会删（要删得加 -v）
  backend-data:
  caddy-data:
  caddy-config:

networks:
  jev-net:
    driver: bridge

# ── 手动部署 ──────────────────────────────────────────────────────────
# 1. 建 .env：
#      GH_OWNER=你的GitHub用户名
#      DOMAIN=your-domain.com        # 留空则只用 HTTP
#      ACME_EMAIL=you@example.com    # 证书到期提醒
# 2. 建 Caddyfile（有域名时）：
#      your-domain.com {
#          reverse_proxy frontend:80
#      }
#    无域名时：
#      :80 {
#          reverse_proxy frontend:80
#      }
# 3. docker compose -f docker-compose.prod.yml up -d
